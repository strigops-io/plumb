# Modified by Plumb contributors on 2026-09-20: PG17/18 runtime matrix, selective IO,
# top-k/RLS regressions and portable/SIMD parity coverage.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalar-and-language:
    name: Scalar postings and language / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned toolchain components
        run: rustup component add rustfmt clippy
      - name: Check postings formatting
        run: cargo fmt --package plumb-postings --check
      - name: Test scalar postings and inherited language suites
        run: cargo test --locked -p plumb-postings -p tinql -p tokenizer -p boldi-vigna
      - name: Test optimized postings
        run: cargo test --locked --release -p plumb-postings
      - name: Lint postings
        run: cargo clippy --locked -p plumb-postings --all-targets -- -D warnings

  build-and-test:
    name: ${{ matrix.arch.name }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86-64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
        postgres: [17, 18]

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure pgrx home
        run: echo "PGRX_HOME=$RUNNER_TEMP/pgrx" >> "$GITHUB_ENV"

      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison \
            build-essential \
            ccache \
            flex \
            libreadline-dev \
            libssl-dev \
            libxml2-dev \
            libxml2-utils \
            libxslt1-dev \
            pkg-config \
            xsltproc \
            zlib1g-dev

      - name: Install pinned Rust toolchain and Clippy
        run: rustup component add clippy

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version 0.19.1 --locked

      - name: Install PostgreSQL ${{ matrix.postgres }}
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: cargo pgrx init "--pg${PG_MAJOR}=download" --jobs "$(nproc)"

      - name: Build
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: cargo build --locked --package plumb --no-default-features --features "pg${PG_MAJOR}"

      - name: Clippy
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features "pg${PG_MAJOR} pg_test" -- -D warnings

      - name: Test live PostgreSQL storage, top-k, snapshots and RLS
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        shell: bash
        run: |
          set -euo pipefail
          cargo pgrx test "pg${PG_MAJOR}" --package plumb --no-default-features --features "pg${PG_MAJOR}" 2>&1 | tee "pg${PG_MAJOR}-tests.log"
          printf '### PostgreSQL %s runtime tests\n\n' "$PG_MAJOR" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/test result:/p' "pg${PG_MAJOR}-tests.log" >> "$GITHUB_STEP_SUMMARY"
